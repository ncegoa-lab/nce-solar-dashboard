name: Automated Solar Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv pandas requests

      - name: Run Solar Scrapers & Supabase Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Run the scrapers for your active solar brands (uncomment/adjust as needed)
          if [ -f "solis_capture_to_generation.py" ]; then python solis_capture_to_generation.py; fi
          if [ -f "fronius_backend_current_generation.py" ]; then python fronius_backend_current_generation.py; fi
          if [ -f "sems_daily_log.py" ]; then python sems_daily_log.py; fi
          if [ -f "solax_capture_to_generation.py" ]; then python solax_capture_to_generation.py; fi
          if [ -f "fimer_backend_export_generation.py" ]; then python fimer_backend_export_generation.py; fi

          # Upload all newly generated data files to Supabase
          python sync_to_supabase.py
